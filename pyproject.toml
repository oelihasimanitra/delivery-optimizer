[project]
name = "deliveryopt"
version = "0.2.0"
description = "Optimisation des tournées de livraison (Antananarivo) : règles métier, tarifs, explications."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
deliveryopt = ["static/*", "static/vendor/*"]
